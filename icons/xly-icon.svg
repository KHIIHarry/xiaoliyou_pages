<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">XLY 暖色猫咪图标</title>
  <desc id="desc">以圆润的 X、L、Y 字母组成一只微笑的猫咪，奶油底色与珊瑚橙、杏黄色的简约矢量 PWA 图标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFAF3"/>
      <stop offset="1" stop-color="#FFF0DF"/>
    </linearGradient>
    <linearGradient id="cat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAB65"/>
      <stop offset="1" stop-color="#FF884F"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8D68"/>
      <stop offset="1" stop-color="#FF7559"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD16D"/>
      <stop offset="1" stop-color="#FFBA49"/>
    </linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAB51"/>
      <stop offset="1" stop-color="#FF8B4B"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed, maskable PWA background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- The outer cat silhouette is one continuous, rounded vector stroke -->
  <path d="M108 309
           C96 294 102 263 116 250
           C118 210 132 152 154 151
           C171 149 196 176 209 189
           Q257 171 303 189
           C320 170 344 149 362 151
           C386 154 397 210 400 249
           Q413 258 420 272"
        fill="none" stroke="url(#cat)" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Closed smiling eyes -->
  <path d="M191 242 Q206 221 221 242" fill="none" stroke="#AB5A37" stroke-width="10" stroke-linecap="round"/>
  <path d="M291 242 Q306 221 321 242" fill="none" stroke="#AB5A37" stroke-width="10" stroke-linecap="round"/>

  <!-- Letterforms are actual vector paths, not a font/image -->
  <g fill="none" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M143 271 L202 353 M202 271 L143 353" stroke="url(#x)"/>
    <path d="M256 271 L256 349 Q256 352 260 352 L295 352" stroke="url(#l)"/>
    <path d="M325 271 L361 310 L396 271 M361 310 L361 353" stroke="url(#y)"/>
  </g>
</svg>
